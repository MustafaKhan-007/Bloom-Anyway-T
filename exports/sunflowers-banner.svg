<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 48" width="1960" height="192">
  <!-- Bloom Anyway favicon sunflowers, side by side, transparent background -->
  <defs>
    <g id="sunflower">
      <g fill="#EFA733">
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(30 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(60 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(90 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(120 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(150 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(180 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(210 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(240 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(270 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(300 20 20)"/>
        <ellipse cx="20" cy="7" rx="3.1" ry="7.2" transform="rotate(330 20 20)"/>
