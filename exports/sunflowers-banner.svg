      <circle cx="20" cy="20" r="6.6" fill="#571F46"/>
      <circle cx="20" cy="20" r="6.6" fill="none" stroke="#EFA733" stroke-width="1.4" opacity="0.5"/>
    </g>
  </defs>
  <use href="#sunflower" x="4" y="4"/>
  <use href="#sunflower" x="52" y="4"/>
  <use href="#sunflower" x="100" y="4"/>
  <use href="#sunflower" x="148" y="4"/>
  <use href="#sunflower" x="196" y="4"/>
  <use href="#sunflower" x="244" y="4"/>
  <use href="#sunflower" x="292" y="4"/>
  <use href="#sunflower" x="340" y="4"/>
  <use href="#sunflower" x="388" y="4"/>
  <use href="#sunflower" x="436" y="4"/>
