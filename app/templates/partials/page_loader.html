{# Soft swaying sunflower while a page or form is loading. #}
<div id="page-loader" class="page-loader" hidden aria-hidden="true" role="status">
  <div class="page-loader__bloom" aria-hidden="true">
    <svg class="page-loader__sun" viewBox="0 0 40 40" width="64" height="64" focusable="false">
      <g class="page-loader__petals" fill="#EFA733">
        <ellipse class="page-loader__petal" style="--i: 0" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 1" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 2" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 3" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 4" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 5" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 6" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 7" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 8" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 9" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 10" cx="20" cy="7" rx="3.1" ry="7.2"/>
        <ellipse class="page-loader__petal" style="--i: 11" cx="20" cy="7" rx="3.1" ry="7.2"/>
      </g>
      <circle class="page-loader__center" cx="20" cy="20" r="6.6" fill="#571F46"/>
      <circle class="page-loader__ring" cx="20" cy="20" r="6.6" fill="none" stroke="#EFA733" stroke-width="1.4"/>
    </svg>
  </div>
  <span class="sr-only">Loading</span>
</div>
