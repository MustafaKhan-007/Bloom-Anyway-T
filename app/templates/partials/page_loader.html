{# Soft spinning sunflower — petals sway on their hinges as it turns. #}
<div id="page-loader" class="page-loader" hidden aria-hidden="true" role="status">
  <div class="page-loader__bloom" aria-hidden="true">
    <svg class="page-loader__sun" viewBox="0 0 40 40" width="64" height="64" focusable="false">
      <g class="page-loader__spin">
        <g class="page-loader__petals" fill="#EFA733">
          <g class="page-loader__petal" style="--i: 0" transform="rotate(0 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 1" transform="rotate(30 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 2" transform="rotate(60 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 3" transform="rotate(90 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 4" transform="rotate(120 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 5" transform="rotate(150 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 6" transform="rotate(180 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 7" transform="rotate(210 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 8" transform="rotate(240 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 9" transform="rotate(270 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 10" transform="rotate(300 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
          <g class="page-loader__petal" style="--i: 11" transform="rotate(330 20 20)">
            <ellipse class="page-loader__leaf" cx="20" cy="7" rx="3.1" ry="7.2"/>
          </g>
        </g>
        <circle class="page-loader__center" cx="20" cy="20" r="6.6" fill="#571F46"/>
        <circle class="page-loader__ring" cx="20" cy="20" r="6.6" fill="none" stroke="#EFA733" stroke-width="1.4"/>
      </g>
    </svg>
  </div>
  <span class="sr-only">Loading</span>
</div>
