{# Shared bloom cover (default) or uploaded photo for Courses / My space cards. #}
{% macro bloom_cover(title, kind_short, cover_color, cover_image=none) %}
<div class="lib-card__cover{% if cover_image %} lib-card__cover--photo{% endif %}"
     {% if not cover_image %}style="--lib-cover: {{ cover_color }};"{% endif %}
     aria-hidden="true">
  {% if cover_image %}
  <img class="lib-card__cover-img" src="{{ cover_image }}" alt="">
  {% else %}
  <svg class="lib-card__bloom" viewBox="0 0 80 90" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M40 78 V42" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M40 58 C28 52 22 42 24 32" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M40 52 C52 46 58 36 56 26" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="40" cy="28" rx="7" ry="11" stroke="currentColor" stroke-width="1.3"/>
    <ellipse cx="40" cy="28" rx="7" ry="11" stroke="currentColor" stroke-width="1.3" transform="rotate(40 40 28)"/>
    <ellipse cx="40" cy="28" rx="7" ry="11" stroke="currentColor" stroke-width="1.3" transform="rotate(80 40 28)"/>
    <ellipse cx="40" cy="28" rx="7" ry="11" stroke="currentColor" stroke-width="1.3" transform="rotate(120 40 28)"/>
    <circle cx="40" cy="28" r="4.2" fill="currentColor" opacity="0.35"/>
  </svg>
  <p class="lib-card__cover-title">{{ title }}</p>
  <span class="lib-card__cover-kind">{{ kind_short }}</span>
  <span class="lib-card__cover-brand">bloom anyway.</span>
  {% endif %}
</div>
{% endmacro %}
