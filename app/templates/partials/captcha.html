{# Image-identification captcha grid. Expects `captcha` dict from captcha_challenge(). #}
{% if captcha %}
<div class="field captcha-field">
  <span class="captcha-field__prompt" id="captcha-prompt">{{ captcha.prompt }}</span>
  <p class="field-help">Tap every matching picture. This helps keep bots out.</p>
  <div class="captcha-grid" role="group" aria-labelledby="captcha-prompt">
    {% for i in range(captcha.count) %}
    <label class="captcha-tile">
      <input type="checkbox" name="captcha" value="{{ i }}"
             aria-label="Image {{ i + 1 }}">
      <img src="{{ url_for('auth.captcha_tile', index=i, v=captcha.token) }}"
           width="96" height="96" alt="" draggable="false">
    </label>
    {% endfor %}
  </div>
  <a class="captcha-refresh" href="?refresh_captcha=1{% if next %}&amp;next={{ next|urlencode }}{% endif %}">New images</a>
</div>
{% endif %}
